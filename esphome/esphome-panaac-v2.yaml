substitutions:
  device_name: "esphome-panaac-v2"
  device_friendlyname: "ESPHome_PanaAC_v2"

esphome:
  name: "${device_name}"
  friendly_name: "${device_friendlyname}"
  min_version: 2025.9.0
  name_add_mac_suffix: false

  # Optional ESPHome sub-device grouping. When enabled, the native climate entity and
  # companion Swing V/H selects are all assigned to this HVAC sub-device.
  # devices:
  #   - id: hvac
  #     name: Living Room AC

# Load the panaac_v2 custom component from the sibling components/ folder.
external_components:
  - source: components

# Wemos D1 mini / NodeMCU ESP-12E (ESP8266, 4 MB flash).
esp8266:
  board: d1_mini

# Enable logging
logger:

# Native Home Assistant API — exposes the "(v1)" climate and the two
# Swing V/H selects at the root of the ESPHome device, exactly like PanaAC v1. The full-featured
# v2 climate card comes from the PanaAC v2 HA custom integration over MQTT (separate device).
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Keep the ESP8266 radio awake. With the default (modem sleep) the first command after an idle
  # period waits ~1 s for the radio to wake on the next DTIM beacon — the lag the user saw. NONE
  # trades a little idle power for sub-second command responsiveness (this device is USB-powered).
  power_save_mode: NONE
  ap:
    ssid: "${device_name}-ap"
    password: !secret wifi_ap_password

captive_portal:

# MQTT broker (the same broker used by Home Assistant). Only the broker/auth/discovery need to be
# set here — the panaac_v2 component itself auto-configures the MQTT availability (birth /
# last-will / shutdown) on the panaac_v2/<prefix>/availability topic in v2 mode, so the PanaAC v2
# HA integration reliably sees online/offline (incl. broker restart / device crash / graceful
# shutdown) without any birth_message/will_message/shutdown_message here.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_pass
  # Discovery is OFF: the full-featured v2 climate is exposed via the PanaAC v2 HA custom
  # integration over the panaac_v2/<prefix>/... topics (not via standard MQTT discovery, which
  # would create a duplicate climate). The "(v1)" climate and the two
  # Swing V/H selects are exposed via the native API (see `api:` above) — ESPHome only
  # MQTT-discovers platform entities, not programmatically-created selects, so the native API is
  # their transport.
  discovery: false

# Non-invasive wiring: separate IR receiver and IR LED.
#   GPIO14 = D5  <- IR receiver (TSOP38xxx) data pin
#   GPIO13 = D7  <- IR LED anode (via transistor) — 38 kHz carrier, ir_control: true
remote_receiver:
  pin:
    number: GPIO14
    inverted: True
  tolerance: 55%
  id: ir_receiver
  idle: 5ms

remote_transmitter:
  carrier_duty_percent: 50%
  pin:
    number: GPIO13
  id: ir_transmitter

# Example optional temperature sensor.
# Using a dummy template sensor that reports a fixed 26.5 °C for testing.
sensor:
  - platform: template
    name: "Room Temperature"
    id: room_temp
    lambda: return 26.5;
    update_interval: 30s
    unit_of_measurement: "°C"
    device_class: temperature

panaac_v2:
  name: "Remote Controller"
  # Optional: assign the climate and Swing V/H entities to an ESPHome sub-device.
  # device_id: hvac
  id: panaac_v2_climate
  receiver_id: ir_receiver
  transmitter_id: ir_transmitter
  # Setting topic_prefix enables v2 MQTT mode: the full-featured v2 climate is exposed over the
  # custom panaac_v2/<prefix>/... MQTT JSON topics (consumed by the PanaAC v2 HA custom
  # integration). The "(v1)" climate and the two Swing V/H selects are ALSO
  # created and kept visible on the native API, at the root of the ESPHome device (no sub-device),
  # exactly like PanaAC v1. The v2 custom topics are independent of the native ClimateTraits, so
  # the v2 HA card is unaffected.
  topic_prefix: "panaac_v2/${device_name}"
  # hide_legacy_comps (v2 mode only): when true the on-device "(v1)" climate + its two
  # Swing V/H selects are made `internal` and hidden from Home Assistant (the v2 climate card
  # comes from the PanaAC v2 HA custom integration over MQTT, so they would only duplicate it).
  # Set to false (the default) to keep them visible on the native API. In v1 mode the flag is
  # ignored and the climate + selects are always visible.
  hide_legacy_comps: false
  supports_cool: true
  supports_heat: true
  supports_fan_only: true
  supports_quiet: true
  supports_powerful: true
  supports_eco: true
  supports_nanoe_g: true  # nanoe-G button on the remote (byte 17 bit 1 of the state frame)
  supports_sleep: true    # SLEEP button: each press sends the next captured step (11-step cycle)
  supports_timer: true    # ON/OFF timers; the remote's timer frames carry the clock, so time_id is required
  time_id: ha_time
  fan_5level: true
  swing_horizontal: true
  temp_step: 0.5
  ir_control: true
  sensor: room_temp
  # Keep the nanoe-G switch (below) in sync when nanoe-G changes via MQTT or the physical remote.
  on_state:
    - switch.template.publish:
        id: panaac_nanoe_g
        state: !lambda 'return id(panaac_v2_climate).ac_state.nanoe_g;'
  # More standard Climate automations are supported (on_state is used above; uncomment to use):
  # on_control:
  #   - lambda: |-
  #       if (x.get_mode().has_value()) {
  #         ESP_LOGD("panaac", "Control call, mode=%s", climate_mode_to_string(x.get_mode().value()));
  #       }

# nanoe-G, SLEEP and timers as Home Assistant entities. These call public methods of the panaac_v2
# component, so they work in both v1-native and v2-MQTT mode. (In v2 MQTT mode you can also send
# {"nanoe_g": true} / {"sleep": true} to the <topic_prefix>/set topic.)
switch:
  - platform: template
    name: "nanoe-G"
    id: panaac_nanoe_g
    icon: mdi:air-purifier
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - lambda: id(panaac_v2_climate).set_nanoe_g(true);
    turn_off_action:
      - lambda: id(panaac_v2_climate).set_nanoe_g(false);

button:
  - platform: template
    name: "Sleep"
    icon: mdi:power-sleep
    on_press:
      - lambda: id(panaac_v2_climate).send_sleep();  # next step, like pressing the remote's button
  - platform: template
    name: "Cancel Timers"
    icon: mdi:timer-off
    on_press:
      - lambda: id(panaac_v2_climate).cancel_timers();

# Timers as Home Assistant entities: minutes after midnight (e.g. 420 = 07:00). Setting a value enables
# that timer; "Cancel Timers" clears both. (In v2 MQTT mode you can also send {"on_timer": "07:00"},
# {"off_timer": "06:00"} or {"on_timer": "off"} to the <topic_prefix>/set topic.)
number:
  - platform: template
    name: "ON Timer (minutes after midnight)"
    id: panaac_on_timer
    min_value: 0
    max_value: 1439
    step: 1
    unit_of_measurement: "min"
    mode: box
    optimistic: true
    set_action:
      - lambda: id(panaac_v2_climate).set_on_timer(static_cast<uint16_t>(x));
  - platform: template
    name: "OFF Timer (minutes after midnight)"
    id: panaac_off_timer
    min_value: 0
    max_value: 1439
    step: 1
    unit_of_measurement: "min"
    mode: box
    optimistic: true
    set_action:
      - lambda: id(panaac_v2_climate).set_off_timer(static_cast<uint16_t>(x));

# Clock for the timers (the Panasonic remote's timer frames include the current time).
time:
  - platform: homeassistant
    id: ha_time
