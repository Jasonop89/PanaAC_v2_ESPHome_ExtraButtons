substitutions:
  device_name: "esphome-panaac-v2-v1"
  device_friendlyname: "ESPHome_PanaAC_v2 (v1 mode)"

esphome:
  name: "${device_name}"
  friendly_name: "${device_friendlyname}"
  min_version: 2025.9.0
  name_add_mac_suffix: false

# Load the panaac_v2 custom component from the sibling components/ folder.
external_components:
  - source: components

# Wemos D1 mini / NodeMCU ESP-12E (ESP8266, 4 MB flash).
esp8266:
  board: d1_mini

# Enable logging
logger:

# Native Home Assistant API — the climate + 2 Swing V/H selects are exposed here (v1 mode).
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Keep the ESP8266 radio awake so the first command after an idle period isn't delayed ~1 s by
  # modem-sleep wake (DTIM). NONE trades a little idle power for sub-second responsiveness
  # (this device is USB-powered).
  power_save_mode: NONE
  ap:
    ssid: "${device_name}-ap"
    password: !secret wifi_ap_password

captive_portal:

# v1 mode uses the native API (above) to expose the climate + 2 Swing V/H selects — no MQTT
# broker is required. If you do add a `mqtt:` block, the climate is additionally published via
# ESPHome's standard MQTT discovery (like PanaAC v1); the selects stay on the native API. Either
# way, NO `topic_prefix` is set on panaac_v2 below, so the custom v2 MQTT topics are NOT used.
# Fan levels (Auto / Level 1..5 / Quiet) are the climate's Fan Mode (custom fan modes) — there is
# no separate Fan Level select.

# Non-invasive wiring: separate IR receiver and IR LED.
#   GPIO14 = D5  <- IR receiver (TSOP38xxx) data pin, inverted
#   GPIO13 = D7  <- IR LED anode (via transistor) — 38 kHz carrier, ir_control: true
remote_receiver:
  pin:
    number: GPIO14
    inverted: True
  tolerance: 55%
  id: ir_receiver
  idle: 5ms

remote_transmitter:
  carrier_duty_percent: 50%
  pin:
    number: GPIO13
  id: ir_transmitter

# Example optional temperature sensor.
sensor:
  - platform: template
    name: "Room Temperature"
    id: room_temp
    lambda: return 26.5;
    update_interval: 30s
    unit_of_measurement: "°C"
    device_class: temperature

# v1 native mode: NO topic_prefix. The component behaves like PanaAC v1 — a native climate
# whose Fan Mode carries the full Panasonic fan levels (Auto / Level 1..5 / Quiet, named
# "<name> (v1)") plus the two Swing V/H selects, all at the root of the
# ESPHome device (no sub-device), exactly like PanaAC_ESPHome. The "(v1)" name suffix is
# added by the component in both modes.
panaac_v2:
  name: "Remote Controller"
  id: panaac_v2_climate
  receiver_id: ir_receiver
  transmitter_id: ir_transmitter
  # hide_legacy_comps has NO effect in v1 mode (no topic_prefix): the climate + selects are the
  # user-facing entities here and are always kept visible. It only hides them in v2 mode, where
  # the PanaAC v2 HA custom integration provides the climate card over MQTT instead.
  # hide_legacy_comps: true
  supports_cool: true
  supports_heat: true
  supports_fan_only: true
  supports_quiet: true
  supports_powerful: true
  supports_eco: true
  supports_nanoe_g: true  # nanoe-G button on the remote (byte 17 bit 1 of the state frame)
  supports_sleep: true    # SLEEP button: each press sends the next captured step (11-step cycle)
  supports_timer: true    # ON/OFF timers; the remote's timer frames carry the clock, so time_id is required
  time_id: ha_time
  fan_5level: true
  swing_horizontal: true
  temp_step: 0.5
  ir_control: true
  sensor: room_temp
  # Keep the nanoe-G switch (below) in sync when nanoe-G changes via MQTT or the physical remote.
  on_state:
    - switch.template.publish:
        id: panaac_nanoe_g
        state: !lambda 'return id(panaac_v2_climate).ac_state.nanoe_g;'

# nanoe-G, SLEEP and timers as Home Assistant entities. These call public methods of the panaac_v2
# component, so they work in both v1-native and v2-MQTT mode. (In v2 MQTT mode you can also send
# {"nanoe_g": true} / {"sleep": true} to the <topic_prefix>/set topic.)
switch:
  - platform: template
    name: "nanoe-G"
    id: panaac_nanoe_g
    icon: mdi:air-purifier
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - lambda: id(panaac_v2_climate).set_nanoe_g(true);
    turn_off_action:
      - lambda: id(panaac_v2_climate).set_nanoe_g(false);

button:
  - platform: template
    name: "Sleep"
    icon: mdi:power-sleep
    on_press:
      - lambda: id(panaac_v2_climate).send_sleep();  # next step, like pressing the remote's button
  - platform: template
    name: "Cancel Timers"
    icon: mdi:timer-off
    on_press:
      - lambda: id(panaac_v2_climate).cancel_timers();

# Timers as Home Assistant entities: minutes after midnight (e.g. 420 = 07:00). Setting a value enables
# that timer; "Cancel Timers" clears both. (In v2 MQTT mode you can also send {"on_timer": "07:00"},
# {"off_timer": "06:00"} or {"on_timer": "off"} to the <topic_prefix>/set topic.)
number:
  - platform: template
    name: "ON Timer (minutes after midnight)"
    id: panaac_on_timer
    min_value: 0
    max_value: 1439
    step: 1
    unit_of_measurement: "min"
    mode: box
    optimistic: true
    set_action:
      - lambda: id(panaac_v2_climate).set_on_timer(static_cast<uint16_t>(x));
  - platform: template
    name: "OFF Timer (minutes after midnight)"
    id: panaac_off_timer
    min_value: 0
    max_value: 1439
    step: 1
    unit_of_measurement: "min"
    mode: box
    optimistic: true
    set_action:
      - lambda: id(panaac_v2_climate).set_off_timer(static_cast<uint16_t>(x));

# Clock for the timers (the Panasonic remote's timer frames include the current time).
time:
  - platform: homeassistant
    id: ha_time
